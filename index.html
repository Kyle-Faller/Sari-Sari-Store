<style>
:root{--navy:#303f9f;--nd:#1a237e;--amb:#ffb300;--ad:#9a5f00;--bg:#eef1fa;--card:#fff;--tx:#1d2233;--mu:#667085;--ln:#dde2f3;--dg:#c62828;--ok:#2e7d32;--gc:#0a5bd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10142b;--card:#1a2040;--tx:#e8ebf7;--mu:#9aa3c7;--ln:#2d3560;--ad:#ffc34d;--navy:#5c6bc0;--ok:#66bb6a;--gc:#6aa8ff}}
:root[data-theme="dark"]{--bg:#10142b;--card:#1a2040;--tx:#e8ebf7;--mu:#9aa3c7;--ln:#2d3560;--ad:#ffc34d;--navy:#5c6bc0;--ok:#66bb6a;--gc:#6aa8ff}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0 auto;max-width:640px;background:var(--bg);color:var(--tx);font:500 16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--nd);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px}
.lg{width:42px;height:42px;border-radius:50%;background:var(--amb);color:var(--nd);display:grid;place-items:center;font-weight:800;font-size:20px;border:3px solid #fff}
header button{all:unset;cursor:pointer;flex:1}header b{font-size:20px;font-weight:800;display:block}
.design-button{all:unset!important;flex:none!important;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.14)!important;color:#fff!important;display:grid!important;place-items:center;font:700 23px/1 system-ui,sans-serif!important;cursor:pointer}

main{padding:16px 16px 170px}
h2{margin:6px 0 12px;font-size:22px;font-weight:800}h3{margin:0 0 4px;font-size:20px;font-weight:800}
.sr,input{width:100%;font:600 16px system-ui,sans-serif;padding:13px 14px;margin-top:6px;border:1.5px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx)}
.sr{margin:0 0 14px}input:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 3px rgba(92,107,192,.3)}
label{display:block;font-weight:700;font-size:14px;color:var(--mu);margin-top:12px}
.input-wrap{display:block;position:relative}.input-wrap input{padding-right:48px}
.input-clear{position:absolute;right:8px;top:calc(50% + 3px);transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:var(--ln);color:var(--mu);font:700 22px/1 system-ui;cursor:pointer;display:grid;place-items:center}
.pc,.card{background:var(--card);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(26,35,126,.1);display:flex;align-items:center;gap:12px}
.card{display:block}.in{flex:1;min-width:0}.in b{display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis}.in small{color:var(--mu);font-weight:600}
.av{width:48px;height:48px;border-radius:14px;background:var(--bg);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px;margin-top:4px;background:var(--bg);color:var(--mu)}
.tag.low,.tag.utang{background:#fff1cc;color:#7a4b00}.tag.out{background:#fde0e0;color:var(--dg)}
.tag.gcash{background:rgba(10,108,240,.14);color:var(--gc)}
.qty{display:flex;align-items:center;gap:6px}.qty b{min-width:24px;text-align:center;font-size:18px}
.qty button{width:40px;height:40px;border:0;border-radius:12px;background:var(--navy);color:#fff;font:800 22px system-ui,sans-serif}.qty button:first-child{background:var(--ln);color:var(--tx)}
.b{border:0;border-radius:14px;padding:12px 16px;font:800 15px system-ui,sans-serif;min-height:46px;cursor:pointer}
.p{background:var(--navy);color:#fff}.a{background:var(--amb);color:#1a237e}.g{background:var(--ln);color:var(--tx)}.d{background:none;color:var(--dg);border:1.5px solid var(--dg);width:100%;margin-top:16px}.s{min-height:38px;padding:8px 14px}
.row{display:flex;gap:10px;margin-top:18px}.row .b{flex:1}.sp{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font-size:34px;font-weight:800;color:var(--navy);margin:4px 0}.em{text-align:center;color:var(--mu);padding:50px 20px}

nav button span{display:block;font-size:22px}nav .on{color:var(--navy)}nav i{position:absolute;top:4px;left:56%;background:var(--dg);color:#fff;font:800 11px system-ui;border-radius:99px;padding:1px 6px;font-style:normal}
#cb{bottom:calc(62px + env(safe-area-inset-bottom,0px));padding:0 12px}

#toast{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;z-index:60;max-width:90%;text-align:center;display:none}
.neg{color:var(--dg)}.pos{color:var(--navy)}.hl{font-size:14px;padding:6px 0;border-top:1px solid var(--ln)}
/* ================= RESPONSIVE LAYOUT ================= */
body{max-width:none;width:100%;min-height:100vh}
header{width:100%;padding:14px clamp(16px,4vw,40px)}
main{width:min(100%,1180px);margin:0 auto;padding:22px clamp(14px,3vw,32px) 150px}
#cb,nav{width:calc(100% - 24px);max-width:1100px}
nav{border:1px solid var(--ln);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -4px 18px rgba(26,35,126,.08)}

button,input{touch-action:manipulation}
button:focus-visible{outline:3px solid var(--amb);outline-offset:2px}

.pc{padding:16px}

/* ================= TEXT ALIGNMENT ================= */
main{text-align:center}
main h2,main h3,main .big,main .em{text-align:center}
.card{text-align:center}
.card .sp{text-align:center}

/* Mobile hamburger menu */
.menu-toggle{all:unset;display:none;cursor:pointer;flex:none;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;place-items:center;font:800 26px/1 system-ui,sans-serif;text-align:center}

header button.store-title{flex:1;min-width:0}

.mobile-menu{position:fixed;top:calc(76px + env(safe-area-inset-top,0px));right:12px;z-index:30;width:min(280px,calc(100vw - 24px));padding:8px;background:var(--card);border:1px solid var(--ln);border-radius:18px;box-shadow:0 12px 32px rgba(0,0,0,.22);flex-direction:column;gap:4px}
.mobile-menu.open{display:flex!important}

.mobile-menu button span{font-size:21px;width:28px;text-align:center}
.mobile-menu button.on{background:var(--bg);color:var(--navy)}
.mobile-menu button .menu-count{margin-left:auto;background:var(--dg);color:#fff;border-radius:99px;padding:1px 7px;font:800 11px system-ui,sans-serif}
}
@media(min-width:768px){
.menu-toggle,.mobile-menu{display:none!important}
nav{display:flex!important}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
/* Image upload and preview */
.lg{overflow:hidden;padding:0}
.lg img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}
.av{overflow:hidden}
.av img{display:block;width:100%;height:100%;object-fit:cover;border-radius:14px}
.image-field{margin-top:16px;text-align:left}
.image-field>label{margin:0 0 8px}
.image-preview{width:112px;height:112px;margin:0 auto 10px;border:2px dashed var(--ln);border-radius:16px;background:var(--bg);display:grid;place-items:center;overflow:hidden;color:var(--mu);font-size:12px;text-align:center;padding:8px}
.image-preview.logo-preview{width:104px;height:104px;border-radius:50%}

.image-actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}

.image-help{display:block;color:var(--mu);font-size:12px;text-align:center;margin-top:7px}
.sh button:disabled{opacity:.55;cursor:wait}
/* ================= CHIPS, PAYMENT TOGGLE, GCASH ================= */
.fld{margin-top:16px;text-align:left}.fld>label{margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start}
.chip{border:1.5px solid var(--ln);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;min-height:40px;font:700 14px system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--bg);padding:4px;border-radius:14px;margin-top:14px}
.seg .chip{justify-content:center;border:0;border-radius:11px;background:transparent;min-height:42px}
.seg .chip.on{background:var(--card);color:var(--navy);box-shadow:0 1px 3px rgba(26,35,126,.18)}
.gcd{display:inline-block;width:20px;height:20px;border-radius:50%;background:#0a6cf0;color:#fff;font:800 12px/20px system-ui,sans-serif;text-align:center}
.lsum{background:var(--bg);box-shadow:none;margin:14px 0 0;text-align:center}
/* ================= TRANSACTIONS ================= */
.txl{max-width:760px;margin:0 auto}
.split{display:flex;justify-content:center;gap:8px 22px;flex-wrap:wrap;margin-top:6px;font-weight:600;color:var(--mu)}
.split span{display:inline-flex;align-items:center;gap:6px}.split b{color:var(--tx)}
.txl .chips{margin:4px 0 6px}
.dh{margin:16px 4px 8px;color:var(--mu);font-size:13px;font-weight:700}
.tx{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(26,35,126,.1);cursor:pointer;text-align:left;color:var(--tx);font:500 16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.tx .in b{white-space:nowrap}
.ti{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:21px;background:var(--bg);flex:none}
.ta{font-weight:800;white-space:nowrap;text-align:right}.ta.in-{color:var(--ok)}.ta.ut{color:var(--ad)}
</style></head><body>
<header>
<div class="lg" id="lg"></div>
<button class="store-title" data-a="design" aria-label="Edit store name and logo"><b id="sn"></b></button>
<button class="design-button" type="button" data-a="design" aria-label="Change store design" title="Change store design">✎</button>
<button class="menu-toggle" id="menuToggle" type="button" data-a="menu" aria-label="Open navigation menu" aria-expanded="false">☰</button>
</header>
<div class="mobile-menu" id="mobileMenu" aria-hidden="true">
<button type="button" data-a="tab" data-id="sell"><span>🛒</span>Sell</button>
<button type="button" data-a="tab" data-id="load"><span>📱</span>Load</button>
<button type="button" data-a="tab" data-id="stock"><span>📦</span>Stock<i class="menu-count" id="mobileBd" hidden></i></button>
<button type="button" data-a="tab" data-id="tx"><span>🧾</span>Transactions</button>
<button type="button" data-a="tab" data-id="utang"><span>📒</span>Utang</button>
</div>
<main id="app"></main><div id="cb"></div>
<nav><button data-a="tab" data-id="sell"><span>🛒</span>Sell</button><button data-a="tab" data-id="load"><span>📱</span>Load</button><button data-a="tab" data-id="stock"><span>📦</span>Stock<i id="bd"></i></button><button data-a="tab" data-id="tx"><span>🧾</span>Transactions</button><button data-a="tab" data-id="utang"><span>📒</span>Utang</button></nav>
<div id="toast"></div>
<script>
const K='sari.v1';let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{name:'Sari-Sari Store',products:[],utang:[],tx:[],gcash:0};
if(typeof S.logo!=='string')S.logo='';
if(!Array.isArray(S.products))S.products=[];
if(!Array.isArray(S.utang))S.utang=[];
if(!Array.isArray(S.tx))S.tx=[];
if(typeof S.gcash!=='number'||!isFinite(S.gcash))S.gcash=0;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Storage is full. Remove some images or clear old browser data to save changes.')}};
let tab='sell',cart={},q='',txf='all',txn=60;
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
function closeMobileMenu(){
const menu=$('#mobileMenu'),btn=$('#menuToggle');
if(!menu||!btn)return;
menu.classList.remove('open');menu.setAttribute('aria-hidden','true');
btn.textContent='☰';btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-label','Open navigation menu');
}
function toggleMobileMenu(){
const menu=$('#mobileMenu'),btn=$('#menuToggle');
if(!menu||!btn)return;
const open=!menu.classList.contains('open');
menu.classList.toggle('open',open);menu.setAttribute('aria-hidden',String(!open));
btn.textContent=open?'×':'☰';btn.setAttribute('aria-expanded',String(open));
btn.setAttribute('aria-label',open?'Close navigation menu':'Open navigation menu');
}
const peso=n=>'₱'+(+n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r2=n=>Math.round(n*100)/100;
const dk=t=>new Date(t-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>dk(Date.now());
const st=p=>p.stock<=0?'out':p.stock<=p.min?'low':'ok';
const low=()=>S.products.filter(p=>p.stock<=p.min).sort((a,b)=>a.stock-b.stock);
const total=()=>r2(S.products.reduce((t,p)=>t+(cart[p.id]||0)*p.price,0));
const bal=u=>Math.round((u.a-u.p)*100)/100;
const f=(l,id,v='',t='text',x='',usePlaceholder=false)=>`<label>${l}<span class="input-wrap"><input id="${id}" type="${t==='number'?'text':t}" ${usePlaceholder?`placeholder="${esc(v)}"`:`value="${esc(v)}"`} ${x}></span></label>`;
const imageField=(label,inputId,previewId,existing,kind='product')=>`<div class="image-field"><label for="${inputId}">${label}</label><div class="image-preview ${kind==='logo'?'logo-preview':''}" id="${previewId}">${existing?`<img src="${esc(existing)}" alt="Current image">`:'<span>No image selected</span>'}</div><div class="image-actions"><button type="button" class="b g s" data-remove-image="${inputId}">Remove image</button></div><input id="${inputId}" type="file" accept="image/*"><small class="image-help">Choose a photo from your device. It will be resized to save space.</small></div>`;
async function compressImage(file,maxSide=520){
if(!file||!file.type||!file.type.startsWith('image/'))throw new Error('Please choose an image file.');
if(file.size>15*1024*1024)throw new Error('Please choose an image smaller than 15 MB.');
const url=URL.createObjectURL(file);
try{
const img=new Image();
await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('This image could not be opened. Try another photo.'));img.src=url});
const ratio=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));
const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Your browser could not process this image.');
ctx.drawImage(img,0,0,canvas.width,canvas.height);
const data=canvas.toDataURL('image/webp',0.76);
if(data.length>1200000)throw new Error('This image is still too large. Please choose a smaller photo.');
return data;
}finally{URL.revokeObjectURL(url)}
}
function setupImagePicker(el,inputId,previewId,initialValue,maxSide=520){
let value=initialValue||'',loading=false;
const input=el.querySelector('#'+inputId),preview=el.querySelector('#'+previewId),remove=el.querySelector(`[data-remove-image="${inputId}"]`),submit=el.querySelector('button[type="submit"]');
const draw=()=>{preview.replaceChildren();if(value){const img=document.createElement('img');img.src=value;img.alt='Selected image preview';preview.appendChild(img)}else{const span=document.createElement('span');span.textContent='No image selected';preview.appendChild(span)}};
draw();
input.addEventListener('change',async()=>{
const file=input.files&&input.files[0];if(!file)return;
loading=true;if(submit)submit.disabled=true;
try{value=await compressImage(file,maxSide);draw();toast('Image added. Save your changes to keep it.')}
catch(error){toast(error.message);input.value=''}
finally{loading=false;if(submit)submit.disabled=false}
});
if(remove)remove.addEventListener('click',()=>{value='';input.value='';draw();toast('Image removed. Save to apply the change.')});
return {get value(){return value},get loading(){return loading}};
}

el.onclick=e=>{if(e.target===el||e.target.dataset.c!==undefined)el.remove()};

function sell(method,extra){
const lines=[];
S.products.forEach(p=>{const c=cart[p.id]||0;if(!c)return;const n=Math.min(c*p.per,p.stock);p.stock-=n;p.sold=(p.sold||0)+n;lines.push({n:p.name,q:c,a:r2(c*p.price)})});
const amount=r2(lines.reduce((t,l)=>t+l.a,0));
addTx(Object.assign({kind:'sale',method,amount,lines},extra));
if(method==='GCash')gc(amount);
cart={};save();
const l=low();return l.length?' · Low: '+l.slice(0,3).map(p=>p.name).join(', '):''}
function list(){const k=q.toLowerCase(),a=S.products.filter(p=>p.name.toLowerCase().includes(k));

function bar(){const n=Object.values(cart).reduce((a,b)=>a+b,0);$('#cb').innerHTML=tab==='sell'&&n?`<div><span><small>${n} item${n>1?'s':''} in order</small><b>${peso(total())}</b></span><button class="b g s" data-a="clr">Clear</button><button class="b g s" data-a="ut">Utang</button><button class="b a" data-a="co">Checkout</button></div>`:''}

+S.products.map(p=>`<div class="pc">${productAvatar(p)}<div class="in"><b>${esc(p.name)}</b><small>${p.stock} pcs · alert at ${p.min} · sold ${p.sold||0}</small><br><span class="tag ${st(p)}">${{ok:'In stock',low:'Running low',out:'Out of stock'}[st(p)]}</span></div><button class="b a s" data-a="rs" data-id="${p.id}">Restock</button><button class="b g s" data-a="edit" data-id="${p.id}">Edit</button></div>`).join('')

load(){const loads=S.tx.filter(x=>x.kind==='load').slice(0,10);

+(loads.length?loads.map(txRow).join(''):'<div class="em"><div><p>No load sold yet.</p><p>Tap <b>New load</b> after you send load from GCash.</p></div></div>')+`</div>`},
tx(){const all=S.tx,td=today(),tdy=dk(Date.now()-864e5),now=all.filter(x=>dk(x.t)===td);
const cash=r2(now.filter(x=>x.method==='Cash').reduce((t,x)=>t+x.amount,0)),gcs=r2(now.filter(x=>x.method==='GCash').reduce((t,x)=>t+x.amount,0)),ut=r2(now.filter(x=>x.method==='Utang').reduce((t,x)=>t+x.amount,0));
const rows=all.filter(FL[txf]),shown=rows.slice(0,txn);
let h=`<div class="txl"><div class="sp"><h2>Transactions</h2></div>`
+`<div class="card"><small>Collected today</small><div class="big">${peso(collected(now))}</div><div class="split"><span>💵 Cash <b>${peso(cash)}</b></span><span><span class="gcd">G</span> GCash <b>${peso(gcs)}</b></span></div>${ut>0?`<small class="image-help">${peso(ut)} put on utang today</small>`:''}</div>`
+`<div class="chips">${[['all','All'],['sale','Sales'],['load','Load'],['utang','Utang']].map(([k,l])=>`<button type="button" class="chip${txf===k?' on':''}" data-a="txf" data-id="${k}">${l}</button>`).join('')}</div>`;
if(!shown.length)return h+`<div class="em"><div><p>${all.length?'Nothing here yet.':'No transactions yet.'}</p><p>Sales, load, and utang payments will show up here.</p></div></div></div>`;
let cur='';
shown.forEach(x=>{const k=dk(x.t);if(k!==cur){cur=k;const dayAll=all.filter(y=>dk(y.t)===k),lbl=k===td?'Today':k===tdy?'Yesterday':new Date(x.t).toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'});
h+=`<div class="dh sp"><span>${lbl}</span><span>${peso(collected(dayAll))} collected</span></div>`}
h+=txRow(x)});
if(rows.length>shown.length)h+=`<button type="button" class="b g" style="width:100%;margin-top:6px" data-a="more">Show more</button>`;
return h+'</div>'},
utang(){const u=[...S.utang].sort((a,b)=>(bal(b)>0)-(bal(a)>0)||b.d.localeCompare(a.d)),tot=u.reduce((t,x)=>t+bal(x),0),n=new Set(u.filter(x=>bal(x)>0).map(x=>x.c.toLowerCase())).size;
return`<div class="sp"><h2>Utang</h2><button class="b p s" data-a="uadd">+ Add utang</button></div><div class="card"><small>Total unpaid</small><div class="big">${peso(tot)}</div><small>${n} customer${n===1?'':'s'}</small></div>`
+u.map(x=>`<div class="pc"><div class="in"><b>${esc(x.c)}</b><small>${x.d}${x.n?' · '+esc(x.n):''}</small><br><span class="tag ${bal(x)>0?'low':''}">${bal(x)>0?'Owes '+peso(bal(x)):'Paid'}</span></div>${bal(x)>0?`<button class="b a s" data-a="pay" data-id="${x.id}">Pay</button>`:''}<button class="b g s" data-a="udel" data-id="${x.id}">✕</button></div>`).join('')
+(u.length?'':'<div class="em"><div><p>No utang recorded.</p></div></div>')}};

v=>{
